# Deployment Configuration
deployment:
  type: "self_hosted"

base_url: https://analyst.alfastack.cloud

database:
  url: ${BOW_DATABASE_URL}

features:
  allow_uninvited_signups: true
  allow_multiple_organizations: true
  verify_emails: true

auth:
  # Using local_only to skip Google OAuth setup for now
  mode: "local_only" # hybrid | local_only | sso_only

google_oauth:
  enabled: false

smtp_settings:
  host: ${BOW_SMTP_HOST}
  port: ${BOW_SMTP_PORT}
  username: ${BOW_SMTP_USER}
  password: ${BOW_SMTP_PASSWORD}
  from_email: ${BOW_SMTP_FROM}
  from_name: "Alfa Analyst"
  use_tls: true

encryption_key: ${BOW_ENCRYPTION_KEY}

intercom:
  enabled: false
  app_id: ${BOW_INTERCOM_APP_ID}

telemetry:
  enabled: false
  provider: ${BOW_TELEMETRY_PROVIDER}
  host: ${BOW_POSTHOG_HOST}
  posthog_api_key: ${BOW_POSTHOG_API_KEY}

# license:
#   key: ${BOW_LICENSE_KEY}
